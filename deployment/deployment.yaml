apiVersion: v1
kind: Pod
metadata:
  name: webapp-pod
  labels:
    app: webapp
spec:
  containers:
  - name: webapp
    image: ranjidokcerhub/devopsrepo:webappimg
    ports:
    - containerPort: 8089

apiVersion: apps/v1
kind: Deployment
metadata:
  name:webapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: ranjidokcerhub/devopsrepo:webappimg
        ports:
        - containerPort: 8089

apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  type: loadBalancer
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8089
